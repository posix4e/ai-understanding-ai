name: Publish paper website

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Check out website files only
        uses: actions/checkout@v7
        with:
          sparse-checkout: docs
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Name this upload
        id: artifact
        run: echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
          name: ${{ steps.artifact.outputs.name }}
  deploy:
    needs: upload
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.upload.outputs.artifact_name }}
